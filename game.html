<div id="start-screen" style="
  position:relative; max-width:900px; margin:auto; text-align:center;
  padding:40px; background:#1a1208; color:white; font-family:Georgia,serif;
  border-radius:12px;">

  <h1 style="font-size:36px; margin-bottom:20px;">Игра «Кабинет Поэта»</h1>

  <p style="font-size:20px; line-height:1.5; max-width:600px; margin:auto;">
    В кабинете поэта спрятан важный предмет.  
    Исследуй комнату, нажимай на объекты и найди тот, что хранит тайну.
  </p>

  <button onclick="startGame()" style="
    margin-top:30px; padding:14px 28px; font-size:18px;
    background:#d4a047; color:#1a1208; border:none; border-radius:8px;
    cursor:pointer; font-weight:bold;">
    Продолжить
  </button>
</div>
<div id="cabinet-game" style="display:none; position:relative; max-width:900px; margin:auto;">
  <img src="https://apomous.github.io/map/IMG_4614.jpeg" style="width:100%; display:block;">

  <svg viewBox="0 0 1000 700" style="position:absolute; inset:0; width:100%; height:100%;">

    

  <!-- БЮСТ -->
  <polygon class="zone"
    points="620,110 770,120 830,260 820,430 730,550 640,520 600,340"></polygon>

  <!-- ЛАМПА -->
  <polygon class="zone"
    points="110,260 210,230 250,290 220,360 140,370 110,330"></polygon>

  <!-- ОТКРЫТАЯ КНИГА -->
  <polygon class="zone"
    points="280,380 460,350 530,400 500,500 330,520 280,450"></polygon>

  <!-- СТОПКА КНИГ -->
  <polygon class="zone"
    points="490,320 580,320 600,380 520,390"></polygon>

  <!-- КРАСНАЯ КНИГА -->
  <polygon class="zone"
    points="810,410 900,410 900,520 810,520"></polygon>

  <!-- ОКНО -->
  <polygon class="zone"
    points="690,70 930,70 930,320 690,320"></polygon>

  <!-- ПОРТРЕТ -->
  <polygon class="zone"
    points="100 276 100,85 280,90 280,280"></polygon>



  </svg>
  <div id="coords" style="
  position:fixed;
  bottom:20px;
  right:20px;
  background:rgba(0,0,0,0.7);
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
  font-family:monospace;
  font-size:14px;
  z-index:999999;">
  X: 0 | Y: 0
</div>

<script>
document.addEventListener('mousemove', function(e) {
    const img = document.querySelector('#cabinet-game img');
    const rect = img.getBoundingClientRect();

    // Проверяем, что курсор над изображением
    if (e.clientX >= rect.left && e.clientX <= rect.right &&
        e.clientY >= rect.top && e.clientY <= rect.bottom) {

        // Нормализуем координаты под viewBox 1000x700
        const x = Math.round((e.clientX - rect.left) * (1000 / rect.width));
        const y = Math.round((e.clientY - rect.top) * (700 / rect.height));

        document.getElementById('coords').innerText = X: ${x} | Y: ${y};
    }
});
</script>
</div>
<div id="modal" style="
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(3px);
  justify-content:center; align-items:center; z-index:9999;">
  <div style="
    background:#fff; padding:24px; max-width:420px;
    border-radius:10px; font-family:Georgia,serif;
    text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.4);">
    <div id="modal-text" style="margin-bottom:20px; font-size:18px; line-height:1.5;"></div>
    <button onclick="closeModal()" style="
      padding:10px 22px; border:none; background:#d4a047; color:#1a1208;
      cursor:pointer; border-radius:5px; font-weight:bold;">Закрыть</button>
  </div>
</div>

<script>
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('cabinet-game').style.display = 'block';
}

function hint(text) {
  document.getElementById('modal-text').innerHTML = text;
  document.getElementById('modal').style.display = 'flex';
}

function finalReveal() {
  document.getElementById('modal-text').innerHTML =
    "Вы прикасаетесь к мраморному бюсту…<br><br>" +
    "Под постаментом — щель. Внутри — свернутый листок бумаги.<br>" +
    "Это фрагмент пропавшей рукописи.<br><br>" +
    "<i>Знания — сила. Стихи — могила. Но тайны живут дольше всех.</i>";
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
</script>
<style>
.zone {
  fill: rgba(212, 160, 71, 0.22); /* янтарный */
  stroke: rgba(212, 160, 71, 0.95);
  stroke-width: 4;
  cursor: pointer;
  transition: 0.2s;
}
.zone:hover {
  fill: rgba(255, 220, 150, 0.35);
  stroke: #ffd27f;
}
.correct {
  fill: rgba(255, 120, 80, 0.25);
  stroke: rgba(255, 120, 80, 0.95);
}
</style>
